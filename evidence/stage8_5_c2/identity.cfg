source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter serial 190057000D0000393333574E
adapter speed 100
reset_config none
source [find target/swj-dp.tcl]
swj_newdap zet6 cpu -irlen 4 -expected-id 0x1ba01477
dap create zet6.dap -chain-position zet6.cpu
target create zet6.memory mem_ap -dap zet6.dap -ap-num 0
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
set id [lindex [read_memory 0xE0042000 32 1] 0]
set cpuid [lindex [read_memory 0xE000ED00 32 1] 0]
set capacity [lindex [read_memory 0x1FFFF7E0 16 1] 0]
echo [format "MCU_IDCODE=0x%08X CPUID=0x%08X FLASH_KIB=%d" $id $cpuid $capacity]
if {$id != 0x10036414 || $cpuid != 0x411fc231 || $capacity != 512} {error "Identity mismatch"}
dump_image evidence/stage8_5_c2/uid.bin 0x1FFFF7E8 12
dump_image evidence/stage8_5_c2/option_bytes_before.bin 0x1FFFF800 16
dump_image evidence/stage8_5_c2/idcode.bin 0xE0042000 4
dump_image evidence/stage8_5_c2/cpuid.bin 0xE000ED00 4
dump_image evidence/stage8_5_c2/capacity.bin 0x1FFFF7E0 2
set obr [lindex [read_memory 0x4002201C 32 1] 0]
set wrpr [lindex [read_memory 0x40022020 32 1] 0]
echo [format "OBR=0x%08X WRPR=0x%08X" $obr $wrpr]
if {($obr & 3) != 0 || $wrpr != 0xffffffff} {error "Unexpected protection or option error"}
dump_image evidence/stage8_5_c2/erase_range_before.bin 0x08000000 0xe800
shutdown
