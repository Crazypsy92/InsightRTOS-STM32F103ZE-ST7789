source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter serial 190057000D0000393333574E
source [find target/stm32f1x.cfg]
stm32f1x.cpu configure -event examine-end {}
adapter speed 500
reset_config none
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
set id [lindex [read_memory 0xE0042000 32 1] 0]
set cpuid [lindex [read_memory 0xE000ED00 32 1] 0]
set capacity [lindex [read_memory 0x1FFFF7E0 16 1] 0]
set uid [read_memory 0x1FFFF7E8 32 3]
if {$id != 0x10036414 || $cpuid != 0x411fc231 || $capacity != 512} {error "Identity mismatch; no write"}
foreach actual $uid expected {0x05d8ff31 0x36533130 0x43117928} {
    if {$actual != $expected} {error "UID mismatch; no write"}
}
set obr [lindex [read_memory 0x4002201C 32 1] 0]
set wrpr [lindex [read_memory 0x40022020 32 1] 0]
if {($obr & 3) != 0 || $wrpr != 0xffffffff} {error "Protection mismatch; no write"}
halt
wait_halt 3000
flash probe 0
set info [flash info 0 sectors]
set geometry [regexp -all -inline {#\s*([0-9]+):\s*0x([0-9a-f]+)\s*\(0x([0-9a-f]+)} $info]
if {[llength $geometry] != 1024} {error "Expected 256 erase sectors"}
set index 0
foreach {whole n off size} $geometry {
    if {$n != $index || [expr 0x$off] != $index*2048 || [expr 0x$size] != 2048} {error "Wrong physical page geometry"}
    incr index
}
echo "IDENTITY_AND_256x2KiB_GEOMETRY_RECHECK_PASS"
# Write only the frozen 57988-byte C1 O2 binary. No erase option.
flash write_bank 0 artifacts/stage8_5_c1/o2/insightrtos_zet6_c1_o2.bin 0
shutdown
